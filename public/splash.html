<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file: data:; style-src 'unsafe-inline'"
    />
    <title>Virtual Studio</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        user-select: none;
        -webkit-user-drag: none;
      }
    </style>
  </head>
  <body>
    <!-- splash.html과 같은 폴더(public/)의 splash.png -->
    <img id="splash-image" src="./splash.png" alt="Virtual Studio" />
    <script>
      // Electron main에서 넘긴 절대 경로가 있으면 우선 사용 (빌드/경로 이슈 대비)
      const imageFromMain = new URLSearchParams(window.location.search).get("image");
      if (imageFromMain) {
        document.getElementById("splash-image").src = imageFromMain;
      }
    </script>
  </body>
</html>
